# Azure Pipeline for Worker Service
# This pipeline builds and pushes the worker (.NET) service to Azure Container Registry

# Trigger: Run pipeline when changes are made to the worker service
trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - worker/**

# Pool Configuration
# CHANGE THIS: If using Microsoft-hosted agents, replace with:
# pool:
#   vmImage: 'ubuntu-latest'
pool:
  name: AzureAgent  # Self-hosted agent pool name

# Variables
variables:
  imageRepository: 'worker'
  dockerfilePath: '$(Build.SourcesDirectory)/worker/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)/worker'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build and Push Worker Image'
    jobs:
      - job: BuildAndPush
        displayName: 'Build and Push Docker Image'
        steps:
          # Build and push Docker image to ACR
          - task: Docker@2
            displayName: 'Build and Push Worker Image'
            inputs:
              # CHANGE THIS: Replace <ACR_SERVICE_CONNECTION> with your Azure DevOps service connection name
              # Example: containerRegistry: 'ACR-Connection'
              containerRegistry: '<ACR_SERVICE_CONNECTION>'
              repository: '$(imageRepository)'
              command: 'buildAndPush'
              Dockerfile: '$(dockerfilePath)'
              buildContext: '$(buildContext)'
              tags: |
                $(tag)
                latest

          # Display image information
          - script: |
              echo "Image: $(imageRepository):$(tag)"
              echo "Also tagged as: $(imageRepository):latest"
            displayName: 'Display Image Info'

# Note: Multi-architecture builds
# To build for multiple architectures (e.g., linux/amd64, linux/arm64), you can extend this pipeline
# to use Docker buildx. This would require:
# 1. Installing buildx on the agent
# 2. Creating a builder instance: docker buildx create --use
# 3. Using buildx build with --platform flag: docker buildx build --platform linux/amd64,linux/arm64
# 4. Pushing to ACR with buildx
# For simplicity, this pipeline builds for the default platform (linux/amd64)
